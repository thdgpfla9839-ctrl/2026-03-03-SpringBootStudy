<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
<style type="text/css">
.container{
  margin-top: 50px;
}
.row {
  margin: 0px auto;
  width: 600px;
}
h3 {
  text-align: center;
}
</style>
<script type="text/javascript" src="http://code.jquery.com/jquery.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script type="text/javascript">
let stompClient=null
function connection(){
	const socket=new SockJS('/ws-chat')
	stompClient=Stomp.over(socket)
	
	stompClient.connect({},function(){
		stompClient.subscribe('/topic/public',function(msg){
			const data=JSON.parse(msg.body)
			// string => JSON으로 변환 
			console.log(msg)
			console.log(msg.body)
			showMessage(data)
		})
		
	})
}
function sendMessage()
{
	// JSON => 문자열 형식으로 전송 
	stompClient.send('/app/chat.send',{},JSON.stringify({
		sender:$('#sender').val(),
		message:$('#message').val()
	}))
}
function showMessage(data)
{
	// data=>서버에서 전송된 메세지 
	$('#chat').append(
	  '<li>['+data.sender+']'+data.message+'('+data.time+')'		
	)
	
}
connection()
/*
 *    매칭 
      1. new SockJS('/ws-chat')
         => registry.addEndpoint("/ws-chat")
      2. stompClient.send('/app/chat.send')
         => @MessageMapping("/chat.send")
      3. @SendTo("/topic/public")
         => stompClient.subscribe('/topic/public')
         URI로 매칭 
 */
</script>
</head>
<body>
  <!-- 
     HTTP => 확장
             | 양방향 => 지속성 
             | 알림 / 실시간 채팅  
      | 일회성
     AI => 데이터를 반는 경우 => webscoket 
        => 파이썬 => LLM => 에이전트 => RAG / 임베디드 
        ----------------------------------------- 
     1. stomp : websocket 기반 의 메세지를 주고받기를 위한 메세지프로토콜 
                규칙을 만들어서 사용 
                /topic/chat /topic/ono
     2. websocket : 서버와 클라이언트간 실시간 양방향 통신 기술
     3. sockjs : WebSocket이 안될때 HTTP기반 방식으로 대체하는 라이브러리
     4. kafka : 서버와 서버간 대규모 이벤트 메세지를 비동기으로 전달하는 분선 메세징 시스템 
     5. redis : 데이터를 메모리에 빠르게 저장/조화 인메모리 데이터 저장 장소 
                캐시/세션/실시간 데이터 사용시에 많이 사용 
          | = AI에서 사용이 많다 
     kafka / redis 
              | 데이터를 빠르게 활용 
      | 메세지를 보관 ( 크롤링 ) => 손실방지 
   -->
  <div class="container">
    <div class="row">
      <h3>간단한 WebSocket 채팅</h3>
      <table class="table">
        <tbody>
          <tr>
            <th width=15% class="text-center">이름</th>
            <td width=85%>
              <input type=text id=sender size=20 class="input-sm">
            </td>
          </tr>
          <tr>
            <th width=15% class="text-center">메세지</td>
            <td width=85%>
             <input type=text id="message" size=50 
               class="input-sm">
            </td>
          </tr>
          <tr>
            <td colspan="2" class="text-center">
              <button class="btn-sm btn-primary"
               onclick="sendMessage()">전송</button>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <ul id="chat">
                
              </ul>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
